<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1e1e2e;
            --bg-secondary: #181825;
            --bg-panel: #1e1e2e;
            --bg-toolbar: #11111b;
            --bg-status: #11111b;
            --bg-input: #313244;
            --bg-hover: #45475a;
            --border-color: #313244;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --text-muted: #6c7086;
            --accent-blue: #89b4fa;
            --accent-green: #a6e3a1;
            --accent-red: #f38ba8;
            --accent-yellow: #f9e2af;
            --accent-purple: #cba6f7;
            --accent-peach: #fab387;
            --accent-teal: #94e2d5;
            --error-red-bg: rgba(243, 139, 168, 0.15);
            --search-yellow-bg: rgba(249, 226, 175, 0.2);
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
            --line-height: 1.5;
            --font-size: 14px;
        }

        body {
            font-family: var(--font-mono);
            font-size: var(--font-size);
            line-height: var(--line-height);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === 工具栏 === */
        .toolbar {
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 4px;
        }

        .toolbar button {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 13px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .toolbar button:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .toolbar button:active {
            background: var(--accent-blue);
            color: var(--bg-primary);
            transform: scale(0.97);
        }

        .toolbar button.primary {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border-color: var(--accent-blue);
            font-weight: 600;
        }

        .toolbar button.primary:hover {
            background: #74c7ec;
            border-color: #74c7ec;
        }

        .toolbar button.danger {
            color: var(--accent-red);
        }

        .toolbar button.danger:hover {
            background: var(--accent-red);
            color: var(--bg-primary);
        }

        /* === 历史记录面板 === */
        .history-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .history-panel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 440px;
            max-width: 90vw;
            background: var(--bg-secondary, #262a33);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            z-index: 60;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 12px;
        }

        .history-panel .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 12px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .history-panel .history-head button.link {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            padding: 0 4px;
            font-size: 12px;
            font-family: inherit;
        }

        .history-panel .history-head button.link:hover { text-decoration: underline; }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 4px;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .history-item:hover { background: var(--bg-hover); border-color: var(--border-color); }

        .history-item .history-time {
            flex: 0 0 auto;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 11px;
            padding-top: 1px;
        }

        .history-item .history-preview {
            flex: 1;
            min-width: 0;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .history-item .history-del {
            flex: 0 0 auto;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            line-height: 1.2;
            padding: 0 2px;
            visibility: hidden;
        }

        .history-item:hover .history-del { visibility: visible; }
        .history-item .history-del:hover { color: var(--accent-red); }

        .history-empty {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
        }

        .history-foot {
            display: flex;
            gap: 6px;
            padding: 7px 10px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-toolbar);
        }

        .history-foot button {
            flex: 1;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .history-foot button:hover { background: var(--bg-hover); color: var(--text-primary); }

        .history-foot input[type="file"] { display: none; }

        /* === 主面板 === */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-left {
            flex: 0 0 50%;
            border-right: none;
        }

        /* 左右面板之间的可拖拽分隔条 */
        .splitter {
            flex: 0 0 6px;
            background: var(--bg-toolbar);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            cursor: col-resize;
            user-select: none;
            position: relative;
            z-index: 2;
            transition: background 0.15s ease;
        }
        .splitter:hover, .splitter.dragging { background: var(--bg-hover); }
        .splitter::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 28px;
            border-radius: 2px;
            background: var(--border-color);
            transition: background 0.15s ease;
        }
        .splitter:hover::after, .splitter.dragging::after { background: var(--accent-blue); }
        /* 拖拽过程中禁止选中文本、统一光标 */
        body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

        .panel-header {
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .tree-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-header .tree-actions button {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 1px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .panel-header .tree-actions button:hover:not(:disabled) {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .panel-header .tree-actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* === 搜索栏 === */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar input {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 12px;
            width: 180px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent-blue);
        }

        .search-bar button {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .search-bar button:hover {
            background: var(--bg-hover);
        }

        .search-count {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 40px;
            text-align: center;
        }

        /* === 编辑区 === */
        .editor-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* === 行号区 === */
        .line-numbers {
            background: var(--bg-secondary);
            color: var(--text-muted);
            padding: 8px 0;
            text-align: right;
            user-select: none;
            overflow: hidden;
            min-width: 40px;
            font-family: var(--font-mono);
            font-size: var(--font-size);
            line-height: var(--line-height);
            flex-shrink: 0;
        }

        .line-numbers .line-no {
            padding: 0 12px 0 8px;
            display: block;
            min-height: 21px;
        }

        /* 错误行 */
        .line-numbers .line-no.error-line {
            background: var(--error-red-bg);
            color: var(--accent-red);
            font-weight: bold;
        }

        /* 搜索匹配行 */
        .line-numbers .line-no.search-match {
            background: var(--search-yellow-bg);
            color: var(--accent-yellow);
        }

        .editor-textarea {
            flex: 1;
            background: var(--bg-panel);
            color: var(--text-primary);
            border: none;
            outline: none;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: var(--font-size);
            line-height: var(--line-height);
            resize: none;
            tab-size: 2;
            overflow: auto;
            white-space: pre;
        }

        .editor-textarea::selection {
            background: rgba(137, 180, 250, 0.3);
        }

        /* === Tree 视图 === */
        .tree-container {
            flex: 1;
            overflow: auto;
            padding: 8px 12px;
            background: var(--bg-panel);
        }

        .tree-container details {
            margin-left: 16px;
        }

        .tree-container details > summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: flex-start;
            gap: 4px;
            padding: 1px 0;
        }

        .tree-container details > summary::before {
            content: '▶';
            display: inline-block;
            width: 14px;
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.15s;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .tree-container details[open] > summary::before {
            transform: rotate(90deg);
        }

        .tree-container details > summary:hover {
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
        }

        .tree-container .tree-item {
            padding: 1px 0;
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .tree-container .tree-item::before {
            content: ' ';
            display: inline-block;
            width: 14px;
            flex-shrink: 0;
        }

        /* 类型着色 */
        .tree-container .type-string { color: var(--accent-green); }
        .tree-container .type-number { color: var(--accent-blue); }
        .tree-container .type-boolean { color: var(--accent-purple); }
        .tree-container .type-null { color: var(--text-muted); font-style: italic; }
        .tree-container .type-key { color: var(--accent-peach); }
        .tree-container .bracket { color: var(--text-muted); }
        .tree-container .item-count { color: var(--text-muted); font-size: 12px; }

        /* 局部（单分支）展开/收起按钮：悬停节点行时显示 */
        .tree-container details > summary .branch-actions {
            margin-left: auto;
            display: none;
            align-items: center;
            gap: 2px;
        }

        .tree-container details > summary:hover .branch-actions,
        .tree-container details > summary:focus-within .branch-actions {
            display: inline-flex;
        }

        .tree-container .branch-btn {
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            font-size: 11px;
            line-height: 1.6;
            padding: 0 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .tree-container .branch-btn:hover { color: var(--accent-blue); border-color: var(--text-muted); }
        .tree-container .branch-btn.branch-collapse:hover { color: var(--accent-yellow); }

        /* 混合文本中非 JSON 内容的原文展示块 */
        .tree-container .raw-block {
            margin: 8px 12px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-left: 3px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
        .tree-container .raw-block + .tree-root-node { margin-top: 4px; }

        /* 解析失败的 JSON 段：红色标记块 */
        .tree-container .error-box {
            margin: 8px 10px;
            padding: 8px 12px;
            background: var(--error-red-bg, rgba(255, 80, 80, 0.08));
            border: 1px solid var(--accent-red, #e5534b);
            border-left: 4px solid var(--accent-red, #e5534b);
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(229, 83, 75, 0.15);
        }
        .tree-container .error-box .error-box-head {
            color: var(--accent-red, #e5534b);
            font-weight: 600;
            font-size: 12px;
            line-height: 1.6;
            user-select: text;
        }
        .tree-container .error-box .error-box-msg {
            color: var(--accent-red, #e5534b);
            opacity: 0.85;
            font-size: 12px;
            line-height: 1.6;
            margin: 2px 0 6px;
            font-family: var(--font-mono);
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }
        /* 红框内无法解析的原文 */
        .tree-container .error-box .error-raw {
            margin: 2px 0;
            padding: 2px 6px;
            color: var(--accent-red, #e5534b);
            opacity: 0.9;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            background: transparent;
            border: none;
        }
        .tree-container .error-box .error-raw::selection { background: rgba(229, 83, 75, 0.25); }
        /* 红框内嵌套展示的子树与上层树之间留出间隔 */
        .tree-container .error-box .tree-root-node { margin: 2px 0 6px 8px; }

        /* 错误节点 */
        .tree-container .error-node {
            color: var(--accent-red);
            background: var(--error-red-bg);
            padding: 2px 8px;
            border-radius: 3px;
            border-left: 3px solid var(--accent-red);
            margin: 4px 0 4px 18px;
            font-size: 13px;
        }

        .tree-container .depth-limit {
            color: var(--accent-yellow);
            font-size: 12px;
            margin-left: 18px;
        }

        /* Tree 根节点不缩进 */
        .tree-root-node {
            margin-left: 0 !important;
        }

        /* === 状态栏 === */
        .status-bar {
            background: var(--bg-status);
            border-top: 1px solid var(--border-color);
            padding: 4px 16px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 28px;
        }

        .status-bar.success { color: var(--accent-green); }
        .status-bar.error { color: var(--accent-red); }
        .status-bar.warning { color: var(--accent-yellow); }

        /* 空状态 */
        .tree-placeholder {
            color: var(--text-muted);
            text-align: center;
            padding: 60px 20px;
            font-size: 13px;
        }

        .tree-placeholder .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* CodeMirror 容器 */
        .cm-container {
            flex: 1;
            overflow: hidden;
        }
        .cm-container .cm-editor { height: 100%; }
        .cm-container .cm-editor .cm-scroller {
            font-family: var(--font-mono) !important;
            font-size: var(--font-size) !important;
            line-height: var(--line-height) !important;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 工具栏 -->
<div class="toolbar">
    <div class="toolbar-group">
        <button class="primary" onclick="formatJson()" title="格式化 JSON">格式化</button>
        <button onclick="compressJson()" title="压缩 JSON 为单行">压缩</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
        <button onclick="addEscape()" title='给 " 添加 \ 转义'>添加转义</button>
        <button onclick="removeEscape()" title='去除 \" 中的 \'>去除转义</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
        <button class="danger" onclick="clearAll()" title="清空所有内容">清空</button>
        <button onclick="copyResult()" title="复制格式化后的结果">复制结果</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group" style="margin-left:auto">
        <div class="history-wrap">
            <button id="btnHistory" class="toggle" onclick="toggleHistoryPanel(event)"
                    title="查看/恢复最近输入的历史记录">📜 历史</button>
            <div class="history-panel hidden" id="historyPanel">
                <div class="history-head">
                    <span>最近输入（自动记录，最多 20 条）</span>
                    <button class="link" onclick="clearHistory()" title="删除全部历史">清空</button>
                </div>
                <div class="history-list" id="historyList"></div>
                <div class="history-empty" id="historyEmpty">暂无历史记录</div>
                <div class="history-foot">
                    <button onclick="exportHistory()" title="导出为 .json 文件，可保存到本 HTML 同文件夹便于备份迁移">导出到文件</button>
                    <button onclick="document.getElementById('historyFileInput').click()" title="从备份 .json 文件导入历史">从文件导入</button>
                    <input type="file" id="historyFileInput" accept=".json,application/json" class="hidden"
                           onchange="importHistoryFile(this)">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 主面板 -->
<div class="main-content">
    <!-- 左侧面板 -->
    <div class="panel panel-left">
        <div class="panel-header">
            <span>📝 输入</span>
        </div>
        <!-- 搜索栏 -->
        <div class="search-bar" id="searchBar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索文字..." oninput="onSearchInput()" onkeydown="onSearchKeydown(event)">
            <button onclick="searchPrev()" title="上一个匹配">▲</button>
            <button onclick="searchNext()" title="下一个匹配">▼</button>
            <span class="search-count" id="searchCount">0/0</span>
        </div>
        <!-- 编辑区 -->
        <div class="editor-container">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea class="editor-textarea" id="editorTextarea"
                      spellcheck="false"
                      oninput="onEditorInput()"
                      onscroll="syncLineNumbers()"
                      placeholder="在此输入 JSON 文本..."></textarea>
            <!-- CodeMirror 增强容器（初始隐藏） -->
            <div class="cm-container hidden" id="cmContainer"></div>
        </div>
    </div>

    <!-- 可拖拽分隔条：按住左右拖动可调整两侧宽度，双击恢复均分 -->
    <div class="splitter" id="splitter" title="按住拖动调整左右宽度，双击恢复均分"></div>

    <!-- 右侧面板 -->
    <div class="panel">
        <div class="panel-header">
            <span>🌳 格式化结果</span>
            <div class="tree-actions">
                <button id="btnExpandAll" onclick="expandAllTree()" title="展开树中所有层级" disabled>全部展开</button>
                <button id="btnCollapseAll" onclick="collapseAllTree()" title="收起所有层级，仅保留顶层" disabled>全部收起</button>
            </div>
        </div>
        <div class="tree-container" id="treeContainer">
            <div class="tree-placeholder">
                <div class="icon">{ }</div>
                <div>在左侧输入 JSON，点击"格式化"查看结果</div>
            </div>
        </div>
    </div>
</div>

<!-- 状态栏 -->
<div class="status-bar" id="statusBar">
    <span>就绪</span>
</div>

<script>
    /* ============================================================
     *  全局状态
     * ============================================================ */
    var currentFormattedJson = '';   // 格式化后的 JSON（用于复制）
    var searchMatches = [];          // [{start, end, line}]
    var currentSearchIndex = -1;
    var errorLine = -1;              // 1-based，-1 = 无错误
    var cmEditor = null;             // CodeMirror 实例

    /* ============================================================
     *  编辑器内容统一接口（兼容 textarea / CodeMirror）
     * ============================================================ */
    function getEditorText() {
        if (cmEditor) return cmEditor.state.doc.toString();
        return document.getElementById('editorTextarea').value;
    }

    function setEditorText(content) {
        if (cmEditor) {
            cmEditor.dispatch({
                changes: { from: 0, to: cmEditor.state.doc.length, insert: content }
            });
        } else {
            document.getElementById('editorTextarea').value = content;
            updateLineNumbers();
        }
    }

    /* ============================================================
     *  行号
     * ============================================================ */
    function updateLineNumbers() {
        var textarea = document.getElementById('editorTextarea');
        var lineNumEl = document.getElementById('lineNumbers');
        var text = textarea.value;
        var lines = text.split('\n');
        var lineCount = lines.length;

        // 宽度自适应
        var digits = String(lineCount).length;
        var width = digits * 8 + 16;
        lineNumEl.style.minWidth = width + 'px';

        // 生成行号
        var html = '';
        for (var i = 1; i <= lineCount; i++) {
            var cls = 'line-no';
            if (i === errorLine) cls += ' error-line';
            if (searchMatches.some(function(m) { return m.line === i; })) cls += ' search-match';
            html += '<span class="' + cls + '">' + i + '</span>';
        }
        lineNumEl.innerHTML = html;
    }

    function syncLineNumbers() {
        var textarea = document.getElementById('editorTextarea');
        document.getElementById('lineNumbers').scrollTop = textarea.scrollTop;
    }

    function onEditorInput() {
        errorLine = -1;
        updateLineNumbers();
        scheduleAutoFormat();
        scheduleHistoryRecord();
    }

    /* ============================================================
     *  搜索
     * ============================================================ */
    function onSearchInput() {
        var input = document.getElementById('searchInput').value;
        if (!input) { clearSearch(); return; }
        performSearch(input);
    }

    function onSearchKeydown(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            e.shiftKey ? searchPrev() : searchNext();
        }
    }

    function performSearch(keyword) {
        var text = getEditorText();
        searchMatches = [];
        currentSearchIndex = -1;

        try {
            var regex = new RegExp(escapeRegex(keyword), 'gi');
            var match;
            while ((match = regex.exec(text)) !== null) {
                var line = text.substring(0, match.index).split('\n').length;
                searchMatches.push({ start: match.index, end: match.index + match[0].length, line: line });
            }
        } catch (e) { /* 无效正则 */ }

        if (searchMatches.length > 0) {
            currentSearchIndex = 0;
            // 不在此处调用 highlightSearchMatch，避免抢走搜索框焦点
        }
        updateSearchCount();
        if (!cmEditor) updateLineNumbers();
    }

    function searchNext() {
        if (searchMatches.length === 0) return;
        currentSearchIndex = (currentSearchIndex + 1) % searchMatches.length;
        highlightSearchMatch();
        updateSearchCount();
    }

    function searchPrev() {
        if (searchMatches.length === 0) return;
        currentSearchIndex = (currentSearchIndex - 1 + searchMatches.length) % searchMatches.length;
        highlightSearchMatch();
        updateSearchCount();
    }

    function highlightSearchMatch() {
        if (currentSearchIndex < 0 || currentSearchIndex >= searchMatches.length) return;
        var match = searchMatches[currentSearchIndex];
        var textarea = document.getElementById('editorTextarea');
        textarea.focus();
        textarea.setSelectionRange(match.start, match.end);
        var lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 21;
        var linesBefore = textarea.value.substring(0, match.start).split('\n').length - 1;
        textarea.scrollTop = linesBefore * lineHeight - textarea.clientHeight / 3;
    }

    function clearSearch() {
        searchMatches = [];
        currentSearchIndex = -1;
        updateSearchCount();
        if (!cmEditor) updateLineNumbers();
        var textarea = document.getElementById('editorTextarea');
        textarea.setSelectionRange(textarea.selectionEnd, textarea.selectionEnd);
    }

    function updateSearchCount() {
        var el = document.getElementById('searchCount');
        if (searchMatches.length === 0) {
            el.textContent = '0/0';
        } else {
            el.textContent = (currentSearchIndex + 1) + '/' + searchMatches.length;
        }
    }

    function escapeRegex(str) {
        return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /* ============================================================
     *  自动格式化（复制/输入到左侧后，右侧自动刷新）
     * ============================================================ */
    var autoFormatTimer = null;      // 防抖定时器
    var lastAutoRendered = '';       // 最近一次已自动渲染的左侧文本（避免重复重建）

    function scheduleAutoFormat() {
        clearTimeout(autoFormatTimer);
        autoFormatTimer = setTimeout(autoFormatJson, 500);
    }

    function autoFormatJson() {
        var text = getEditorText().trim();
        if (!text) {
            lastAutoRendered = '';
            restoreTreePlaceholder();
            return;
        }
        // 内容未变化且树已存在时跳过（例如手动"格式化"回填后触发的联动）
        var hasTree = document.querySelector('#treeContainer .tree-root-node') !== null;
        if (hasTree && text === lastAutoRendered) return;
        lastAutoRendered = text;
        formatJson(true);
    }

    function restoreTreePlaceholder() {
        document.getElementById('treeContainer').innerHTML =
            '<div class="tree-placeholder"><div class="icon">{ }</div><div>在左侧输入 JSON，点击"格式化"查看结果</div></div>';
        disableTreeButtons();
    }

    /* ============================================================
     *  JSON 格式化 / 压缩 / 错误处理
     * ============================================================ */
    // onlyRender = true 时仅更新右侧树、不覆盖左侧输入文本（用于自动格式化）
    function formatJson(onlyRender) {
        var text = getEditorText().trim();
        if (!text) { setStatus('', ''); return; }

        // 情形一：整段就是合法 JSON，直接格式化
        var wholeErr = null;
        try {
            var whole = JSON.parse(text);
            applyJsonResult(whole, onlyRender, true);
            return;
        } catch (e) { wholeErr = e; }

        // 情形二：混合文本 → 找出全部可解析的 JSON 段（树化），
        // 非 JSON 部分原样保留；本应是 JSON 却解析失败的段以红色爆标记
        var parts = splitJsonFragments(text);
        var jsonCount = 0;
        var errCount = 0;
        for (var pi = 0; pi < parts.length; pi++) {
            if (parts[pi].type === 'json') jsonCount++;
            else if (parts[pi].type === 'error') errCount++;
        }
        if (jsonCount > 0 || errCount > 0) {
            errorLine = -1;
            if (!cmEditor) updateLineNumbers();
            renderMixedResult(parts);
            if (errCount > 0 && jsonCount > 0) {
                setStatus('warning', '⚠️ 已格式化 ' + jsonCount + ' 段 JSON；另有 ' + errCount + ' 段解析失败（已标红）');
            } else if (errCount > 0) {
                setStatus('warning', '⚠️ 检测到 ' + errCount + ' 段无法解析的 JSON（已标红）');
            } else {
                setStatus('success', jsonCount > 1
                    ? '✅ 已格式化 ' + jsonCount + ' 段 JSON，其余内容原样保留'
                    : '✅ 已格式化日志中的 JSON，其余内容原样保留');
            }
            return;
        }

        // 情形三：完全没有可解析的 JSON
        if (onlyRender) {
            // 自动模式：保留右侧现状，不打断输入，仅状态栏轻提示
            setStatus('warning', '⚠️ 暂未解析到完整 JSON');
            return;
        }
        // 手动模式：若以 { / [ 开头说明本意是 JSON，给出精确行号定位
        if (text.charAt(0) === '{' || text.charAt(0) === '[') {
            var posInfo = extractPosition(wholeErr.message, text);
            errorLine = posInfo.line;
            setEditorText(basicFormat(text));
            if (!cmEditor) { errorLine = posInfo.line; updateLineNumbers(); }
            renderErrorTree(posInfo, text);
            var posText = posInfo.line > 0 ? '第 ' + posInfo.line + ' 行第 ' + posInfo.column + ' 列: ' : '';
            setStatus('error', '❌ ' + posText + wholeErr.message);
            return;
        }
        renderNoJsonHint();
        setStatus('warning', '⚠️ 未检测到合法的 JSON 片段');
    }

    // 统一出口：渲染右侧树。isWhole=true 表示整段输入即 JSON，手动格式化时才回填左侧；
    // 提取片段时（isWhole=false）绝不覆盖左侧日志原文，避免丢失用户粘贴的上下文
    function applyJsonResult(obj, onlyRender, isWhole) {
        var formatted = JSON.stringify(obj, null, 2);
        currentFormattedJson = formatted;
        errorLine = -1;
        var needOverwrite = isWhole && !onlyRender;
        if (needOverwrite) {
            setEditorText(formatted);
            lastAutoRendered = formatted; // 抑制随后自动格式化造成的重复重建
        }
        renderTree(obj);
        setStatus('success', isWhole
            ? (onlyRender ? '✅ 已自动格式化' : '✅ 格式化成功')
            : '✅ 已提取日志中的 JSON 片段并格式化');
    }

    // 拆分混合文本（递归）：返回依次排列的片段数组，每项为
    //   { type: 'text',  text: 原文 }                        —— 非 JSON 内容，原样展示
    //   { type: 'json',  text: 原文, obj }                   —— 成功解析的 JSON 段
    //   { type: 'error', text: 整块原文, message, children } —— 括号能配对但整体解析失败的段（爆红），
    //        children 中仍会细分出内部可解析的 JSON 段与其余原文
    function splitJsonFragments(text) {
        return scanRange(text, 0, text.length);
    }

    function scanRange(text, start, end) {
        var parts = [];
        var cursor = start; // 已归入前面片段的内容末尾
        var i = start;
        while (i < end) {
            var ch = text[i];
            if (ch === '{' || ch === '[') {
                var close = findClosingBracket(text, i);
                if (close > i && close < end) {
                    var frag = text.substring(i, close + 1);
                    try {
                        var obj = JSON.parse(frag);
                        if (cursor < i) parts.push({ type: 'text', text: text.substring(cursor, i) });
                        parts.push({ type: 'json', text: frag, obj: obj });
                        cursor = i = close + 1;
                        continue;
                    } catch (e) {
                        // 该容器整体解析失败：递归分析其内部，将整块作为 error 部件爆红标记
                        var inner = scanRange(text, i + 1, close);
                        if (cursor < i) parts.push({ type: 'text', text: text.substring(cursor, i) });
                        parts.push({ type: 'error', text: frag, message: parseErrBrief(frag, e), children: inner });
                        cursor = i = close + 1;
                        continue;
                    }
                }
            }
            i++;
        }
        if (cursor < end) parts.push({ type: 'text', text: text.substring(cursor, end) });
        return parts;
    }

    // 从 JSON.parse 的错误消息中提取相对片段的行列，生成可读的错误摘要
    function parseErrBrief(block, e) {
        var m = (e && e.message) ? e.message : '格式错误';
        var pm = m.match(/at position\s+(\d+)/i);
        if (pm && pm[1]) {
            var pos = parseInt(pm[1], 10);
            if (pos >= 0 && pos <= block.length) {
                var before = block.substring(0, pos);
                var bLines = before.split('\n');
                var bLine = bLines.length;
                var bCol = bLines[bLines.length - 1].length + 1;
                return m + '（该段内第 ' + bLine + ' 行第 ' + bCol + ' 列附近）';
            }
        }
        return m;
    }

    // 括号配对扫描：从 openIdx（{ 或 [）开始，返回与之匹配的闭合下标；无匹配返回 -1
    function findClosingBracket(text, openIdx) {
        var stack = [text[openIdx]];
        var inStr = false;
        var esc = false;
        for (var i = openIdx + 1; i < text.length; i++) {
            var c = text[i];
            if (esc) { esc = false; continue; }
            if (inStr) {
                if (c === '\\') { esc = true; continue; }
                if (c === '"') inStr = false;
                continue;
            }
            if (c === '"') { inStr = true; continue; }
            if (c === '{' || c === '[') { stack.push(c); continue; }
            if (c === '}' || c === ']') {
                var top = stack[stack.length - 1];
                if ((top === '{' && c === '}') || (top === '[' && c === ']')) {
                    stack.pop();
                    if (stack.length === 0) return i;
                } else {
                    return -1; // 括号错配，非有效 JSON 候选
                }
            }
        }
        return -1;
    }

    // 混合结果渲染：text 段原格式展示（保留缩进换行），json 段以树展示，
    // error 段为红色标记块（解析失败），可嵌套
    function renderMixedResult(parts) {
        var container = document.getElementById('treeContainer');
        container.innerHTML = '';
        container.appendChild(renderParts(parts, false));
        enableTreeButtons();
    }

    // 递归渲染片段列表；ctxError 表示当前处于失败容器的红框内（原文也显示为红色）
    function renderParts(parts, ctxError) {
        var frag = document.createDocumentFragment();
        for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var clean = function(t) {
                return t.replace(/^\s*\n/, '').replace(/[ \t]*\n\s*$/, '');
            };
            if (p.type === 'json') {
                frag.appendChild(buildTreeDom(p.obj, '', 0, false));
            } else if (p.type === 'error') {
                var box = document.createElement('div');
                box.className = 'error-box';
                var head = document.createElement('div');
                head.className = 'error-box-head';
                head.textContent = '❌ 此 JSON 段解析失败，无法树化展示';
                box.appendChild(head);
                if (p.message) {
                    var msg = document.createElement('div');
                    msg.className = 'error-box-msg';
                    msg.textContent = p.message;
                    box.appendChild(msg);
                }
                var body = renderParts(p.children || [], true);
                if (!body.firstChild && p.text) {
                    // 内部无任何内容时，兜底展示该段原文（截断）
                    var raw = document.createElement('div');
                    raw.className = 'error-raw';
                    raw.textContent = p.text.length > 500 ? p.text.substring(0, 500) + ' …' : p.text;
                    box.appendChild(raw);
                } else {
                    box.appendChild(body);
                }
                frag.appendChild(box);
            } else {
                if (!p.text || !p.text.trim()) continue;
                var block = document.createElement('div');
                block.className = ctxError ? 'error-raw' : 'raw-block';
                block.textContent = clean(p.text) + '\n';
                frag.appendChild(block);
            }
        }
        return frag;
    }

    // 右侧空提示：未检测到 JSON 片段
    function renderNoJsonHint() {
        var container = document.getElementById('treeContainer');
        container.innerHTML =
            '<div class="tree-placeholder"><div class="icon">⚠️</div><div>未检测到合法的 JSON 片段</div></div>';
        disableTreeButtons();
    }

    function compressJson() {
        var text = getEditorText().trim();
        if (!text) { setStatus('', ''); return; }

        // 先尝试 JSON 压缩（标准 JSON → 单行）
        try {
            var obj = JSON.parse(text);
            var compressed = JSON.stringify(obj);
            currentFormattedJson = JSON.stringify(obj, null, 2);
            errorLine = -1;
            setEditorText(compressed);
            renderTree(obj);
            setStatus('success', '✅ 压缩成功');
            return;
        } catch (e) { /* 非 JSON，继续走通用压缩 */ }

        // 通用压缩：去除多余空白，合并连续空格/换行为单个空格
        var result = text
            .split('\n').map(function(line) { return line.trim(); })
            .filter(function(line) { return line.length > 0; })
            .join(' ')
            .replace(/\s+/g, ' ');

        currentFormattedJson = '';
        errorLine = -1;
        setEditorText(result);
        setStatus('success', '✅ 压缩成功（非标准 JSON，已去除多余空白）');
    }

    // 从 JSON.parse 错误消息提取 position → 行号列号
    function extractPosition(errorMessage, text) {
        var position = -1, line = -1, column = -1;

        // Chrome: "Unexpected token X in JSON at position N"
        var chromeMatch = errorMessage.match(/at position\s+(\d+)/i);
        if (chromeMatch) position = parseInt(chromeMatch[1]);

        // Firefox: "JSON.parse: expected ... at line M column N"
        var ffMatch = errorMessage.match(/line\s+(\d+)\s+column\s+(\d+)/i);
        if (ffMatch) {
            line = parseInt(ffMatch[1]);
            column = parseInt(ffMatch[2]);
            return { line: line, column: column, position: position };
        }

        // 从 position 推算
        if (position >= 0 && position <= text.length) {
            var before = text.substring(0, position);
            var lines = before.split('\n');
            line = lines.length;
            column = lines[lines.length - 1].length + 1;
        }

        return { line: line, column: column, position: position };
    }

    // 基础格式化（不依赖 JSON.parse，按括号层级缩进）
    function basicFormat(text) {
        var result = '';
        var indent = 0;
        var inString = false;
        var escape = false;

        for (var i = 0; i < text.length; i++) {
            var ch = text[i];

            if (escape) { result += ch; escape = false; continue; }
            if (ch === '\\' && inString) { result += ch; escape = true; continue; }
            if (ch === '"') { inString = !inString; result += ch; continue; }
            if (inString) { result += ch; continue; }

            if (ch === '{' || ch === '[') {
                result += ch + '\n';
                indent++;
                result += '  '.repeat(indent);
            } else if (ch === '}' || ch === ']') {
                result += '\n';
                indent = Math.max(0, indent - 1);
                result += '  '.repeat(indent) + ch;
            } else if (ch === ',') {
                result += ch + '\n' + '  '.repeat(indent);
            } else if (ch === ':') {
                result += ch + ' ';
            } else if (' \t\n\r'.indexOf(ch) >= 0) {
                continue; // 跳过非字符串空白
            } else {
                result += ch;
            }
        }
        return result;
    }

    /* ============================================================
     *  Java 转义字符处理
     * ============================================================ */
    function addEscape() {
        var text = getEditorText();
        if (!text) return;

        // 将每个 " 前添加 \
        setEditorText(text.replace(/"/g, '\\"'));
        errorLine = -1;
        setStatus('success', '✅ 已添加转义');
    }

    function removeEscape() {
        var text = getEditorText();
        if (!text) return;

        // 将每个 \" 还原为 "
        // 逐字符处理，避免误处理 \\"（转义的反斜杠 + 引号）
        var result = '';
        var i = 0;
        while (i < text.length) {
            if (text[i] === '\\' && i + 1 < text.length && text[i + 1] === '"') {
                result += '"';
                i += 2;
            } else {
                result += text[i];
                i++;
            }
        }

        setEditorText(result);
        errorLine = -1;
        setStatus('success', '✅ 已去除转义');
    }

    /* ============================================================
     *  Tree 视图
     * ============================================================ */
    var MAX_DEPTH = 20;

    function renderTree(obj) {
        var container = document.getElementById('treeContainer');
        container.innerHTML = '';
        container.appendChild(buildTreeDom(obj, '', 0, false));
        enableTreeButtons();
    }

    function renderErrorTree(posInfo, originalText) {
        var container = document.getElementById('treeContainer');
        container.innerHTML = '';

        // 尝试部分解析
        var partialObj = null;
        if (posInfo.position > 0) {
            var strategies = [
                tryParse(originalText.substring(0, posInfo.position)),
                tryParse(originalText.substring(0, originalText.lastIndexOf('}', posInfo.position) + 1)),
                tryParse(originalText.substring(0, originalText.lastIndexOf(']', posInfo.position) + 1)),
            ];
            for (var k = 0; k < strategies.length; k++) {
                if (strategies[k] !== null) { partialObj = strategies[k]; break; }
            }
        }

        if (partialObj !== null) {
            container.appendChild(buildTreeDom(partialObj, '', 0, false));
        }

        // 错误节点
        var errorDiv = document.createElement('div');
        errorDiv.className = 'error-node';
        var posText = posInfo.line > 0 ? '第 ' + posInfo.line + ' 行第 ' + posInfo.column + ' 列' : '未知位置';
        errorDiv.textContent = '❌ 解析中断于 ' + posText;
        container.appendChild(errorDiv);

        // 剩余内容提示
        if (posInfo.position > 0 && posInfo.position < originalText.length) {
            var after = originalText.substring(posInfo.position).trim();
            if (after.length > 0) {
                var afterDiv = document.createElement('div');
                afterDiv.className = 'error-node';
                afterDiv.style.opacity = '0.6';
                afterDiv.textContent = '⚠️ 错误后剩余内容: ' + after.substring(0, 200) + (after.length > 200 ? '...' : '');
                container.appendChild(afterDiv);
            }
        }

        enableTreeButtons();
    }

    function tryParse(text) {
        try { return JSON.parse(text); } catch (e) { return null; }
    }

    // 判断容器内是否存在嵌套的对象/数组（决定是否显示局部展开/收起按钮）
    function hasNestedContainers(value) {
        var items;
        if (Array.isArray(value)) {
            items = value;
        } else {
            var keys = Object.keys(value);
            items = [];
            for (var k = 0; k < keys.length; k++) items.push(value[keys[k]]);
        }
        for (var i = 0; i < items.length; i++) {
            var v = items[i];
            if (v !== null && typeof v === 'object') return true;
        }
        return false;
    }

    function buildTreeDom(value, key, depth, isArrayItem) {
        var wrapper = document.createElement('div');

        if (depth > MAX_DEPTH) {
            var limitDiv = document.createElement('div');
            limitDiv.className = 'depth-limit';
            limitDiv.textContent = '⬆ 深度超限（超过 ' + MAX_DEPTH + ' 层）';
            wrapper.appendChild(limitDiv);
            return wrapper;
        }

        if (value === null) return buildValueLine(key, '<span class="type-null">null</span>');
        if (typeof value === 'string') return buildValueLine(key, '<span class="type-string">"' + escapeHtml(value) + '"</span>');
        if (typeof value === 'number') return buildValueLine(key, '<span class="type-number">' + value + '</span>');
        if (typeof value === 'boolean') return buildValueLine(key, '<span class="type-boolean">' + value + '</span>');

        // 对象或数组
        var isArr = Array.isArray(value);
        var count = isArr ? value.length : Object.keys(value).length;
        var typeLabel = isArr ? 'Array' : 'Object';

        var details = document.createElement('details');
        details.open = depth < 3;
        if (depth === 0) details.classList.add('tree-root-node');

        var summary = document.createElement('summary');
        var summaryHtml = '';
        if (key !== '') summaryHtml += '<span class="type-key">"' + escapeHtml(key) + '"</span>: ';
        summaryHtml += '<span class="bracket">' + (isArr ? '[' : '{') + '</span>';
        summaryHtml += ' <span class="item-count">' + typeLabel + '(' + count + ')</span>';
        // 存在嵌套子结构时，提供局部展开/收起按钮
        if (hasNestedContainers(value)) {
            summaryHtml +=
                '<span class="branch-actions">' +
                '<span class="branch-btn branch-expand" ' +
                'onclick="event.stopPropagation();event.preventDefault();setBranchExpand(this,true)" ' +
                'title="展开本分支全部层级">展开</span>' +
                '<span class="branch-btn branch-collapse" ' +
                'onclick="event.stopPropagation();event.preventDefault();setBranchExpand(this,false)" ' +
                'title="收拢本分支（仅保留本层）">收起</span>' +
                '</span>';
        }
        summary.innerHTML = summaryHtml;
        details.appendChild(summary);

        // 子节点
        if (isArr) {
            for (var idx = 0; idx < value.length; idx++) {
                var child = buildTreeDom(value[idx], '', depth + 1, true);
                var indexSpan = document.createElement('span');
                indexSpan.className = 'item-count';
                indexSpan.textContent = '[' + idx + '] ';
                if (child.firstChild) child.firstChild.insertBefore(indexSpan, child.firstChild.firstChild);
                details.appendChild(child);
            }
        } else {
            var keys = Object.keys(value);
            for (var ki = 0; ki < keys.length; ki++) {
                details.appendChild(buildTreeDom(value[keys[ki]], keys[ki], depth + 1, false));
            }
        }

        // 闭合括号
        var closing = document.createElement('div');
        closing.className = 'tree-item';
        closing.innerHTML = '<span class="bracket">' + (isArr ? ']' : '}') + '</span>';
        details.appendChild(closing);

        wrapper.appendChild(details);
        return wrapper;
    }

    function buildValueLine(key, valueHtml) {
        var div = document.createElement('div');
        div.className = 'tree-item';
        var html = '';
        if (key !== '') html += '<span class="type-key">"' + escapeHtml(key) + '"</span>: ';
        html += valueHtml;
        div.innerHTML = html;
        return div;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ============================================================
     *  树的展开 / 收起（全局 + 局部）
     * ============================================================ */
    function enableTreeButtons() {
        document.getElementById('btnExpandAll').disabled = false;
        document.getElementById('btnCollapseAll').disabled = false;
    }

    function disableTreeButtons() {
        document.getElementById('btnExpandAll').disabled = true;
        document.getElementById('btnCollapseAll').disabled = true;
    }

    function expandAllTree() {
        setAllTree(true);
    }

    function collapseAllTree() {
        setAllTree(false);
    }

    // 全局：展开/收起整棵树；收起时保留根节点可见
    function setAllTree(open) {
        var container = document.getElementById('treeContainer');
        container.querySelectorAll('details').forEach(function(d) { d.open = open; });
        if (!open) {
            var root = container.querySelector('.tree-root-node');
            if (root) root.open = true;
        }
    }

    // 局部：展开/收起某个分支节点下的所有层级
    function setBranchExpand(btn, open) {
        var details = btn.closest('details');
        if (!details) return;
        details.querySelectorAll('details').forEach(function(d) { d.open = open; });
        details.open = true;
    }

    /* ============================================================
     *  历史记录：自动记录最近输入，支持恢复/导出/导入
     *  说明：浏览器安全限制下，本地 file:// 页面无法静默写盘，
     *  因此运行时历史自动存于浏览器本地存储（同浏览器持久可用）；
     *  如需跟随文件夹迁移，请用面板内「导出到文件」把 .json 存到
     *  本 HTML 同目录，之后可「从文件导入」恢复。
     * ============================================================ */
    var HISTORY_KEY = 'jsonToolV2_history';
    var MAX_HISTORY = 20;
    var historyList = [];
    var lastRecordedText = '';
    var historyTimer = null;
    var historyRestoring = false; // 恢复中标记：避免恢复动作触发新一轮记录

    function loadHistory() {
        try {
            var raw = localStorage.getItem(HISTORY_KEY);
            if (raw) historyList = JSON.parse(raw);
        } catch (e) { historyList = []; }
        if (!Array.isArray(historyList)) historyList = [];
        if (historyList.length && historyList[0]) lastRecordedText = historyList[0].text || '';
    }

    function saveHistory() {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList)); }
        catch (e) { /* 存储不可用时静默忽略 */ }
    }

    // 输入停顿后记录（防抖，避免打字中间态堆积）
    function scheduleHistoryRecord() {
        clearTimeout(historyTimer);
        historyTimer = setTimeout(function() {
            var text = getEditorText();
            recordHistory(text);
        }, 800);
    }

    // 记录一次输入快照：去空白、去重、限量
    function recordHistory(text) {
        if (!text || !text.trim()) return;
        text = text.trim();
        if (text === lastRecordedText) return;
        lastRecordedText = text;
        // 与已有条目按内容去重：内容相同时更新时间并置顶
        for (var i = 0; i < historyList.length; i++) {
            if (historyList[i].text === text) { historyList.splice(i, 1); break; }
        }
        historyList.unshift({ time: new Date().toISOString(), text: text });
        if (historyList.length > MAX_HISTORY) historyList.length = MAX_HISTORY;
        saveHistory();
        refreshHistoryList();
    }

    function fmtTime(iso) {
        var d;
        try { d = new Date(iso); } catch (e) { d = new Date(); }
        if (isNaN(d.getTime())) d = new Date();
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
            p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    // 列表行预览：首行（去空白行），超过长度省略
    function previewOf(text) {
        var lines = text.split('\n');
        var first = '';
        for (var i = 0; i < lines.length && first === ''; i++) first = lines[i].trim();
        if (!first) first = text.substring(0, 80);
        return first.length > 120 ? first.substring(0, 120) + ' …' : first;
    }

    function refreshHistoryList() {
        var listEl = document.getElementById('historyList');
        var emptyEl = document.getElementById('historyEmpty');
        if (!listEl) return;
        listEl.innerHTML = '';
        var empty = historyList.length === 0;
        if (emptyEl) emptyEl.style.display = empty ? 'block' : 'none';
        historyList.forEach(function(item, idx) {
            var row = document.createElement('div');
            row.className = 'history-item';
            row.title = '点击恢复到左侧输入框';
            row.onclick = function() { restoreHistoryItem(idx); };

            var time = document.createElement('span');
            time.className = 'history-time';
            time.textContent = fmtTime(item.time);

            var preview = document.createElement('span');
            preview.className = 'history-preview';
            preview.textContent = previewOf(item.text);

            var del = document.createElement('button');
            del.className = 'history-del';
            del.textContent = '✕';
            del.title = '删除这条记录';
            del.onclick = function(e) {
                e.stopPropagation();
                historyList.splice(idx, 1);
                saveHistory();
                // 同步防重基准：之后再次输入已删除的内容时可重新记录
                lastRecordedText = historyList.length ? historyList[0].text : '';
                refreshHistoryList();
            };

            row.appendChild(time);
            row.appendChild(preview);
            row.appendChild(del);
            listEl.appendChild(row);
        });
    }

    function toggleHistoryPanel(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        var panel = document.getElementById('historyPanel');
        if (panel.classList.contains('hidden')) {
            refreshHistoryList();
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    function restoreHistoryItem(idx) {
        var item = historyList[idx];
        if (!item) return;
        historyRestoring = true;
        setEditorText(item.text);
        errorLine = -1;
        if (!cmEditor) updateLineNumbers();
        document.getElementById('historyPanel').classList.add('hidden');
        // 立即渲染右侧，并恢复到该输入之前保存过的展开层级
        formatJson(true);
        historyRestoring = false;
    }

    function clearHistory() {
        historyList = [];
        lastRecordedText = '';
        saveHistory();
        refreshHistoryList();
        setStatus('', '已清空历史记录');
    }

    function exportHistory() {
        if (!historyList.length) { setStatus('warning', '暂无历史记录可导出'); return; }
        var d = new Date();
        function p(n) { return (n < 10 ? '0' : '') + n; }
        var stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
            p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
        var blob = new Blob([JSON.stringify(historyList, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'jsonTool-history-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        setStatus('', '已导出备份文件，可保存到本 HTML 同文件夹');
    }

    function importHistoryFile(input) {
        var file = input.files && input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
            try {
                var arr = JSON.parse(reader.result);
                if (!Array.isArray(arr)) throw new Error('格式不正确');
                for (var i = 0; i < arr.length; i++) {
                    var t = arr[i] && arr[i].text;
                    if (typeof t !== 'string' || !t.trim()) continue;
                    recordHistory(t);
                }
                input.value = '';
                refreshHistoryList();
                setStatus('success', '✅ 已导入历史记录');
            } catch (e) {
                input.value = '';
                setStatus('error', '❌ 导入失败：不是有效的历史备份文件');
            }
        };
        reader.readAsText(file);
    }

    // 点击页面其它区域时收起历史面板；Esc 同样收起
    document.addEventListener('click', function(e) {
        var panel = document.getElementById('historyPanel');
        if (!panel || panel.classList.contains('hidden')) return;
        if (e.target.closest && !e.target.closest('.history-wrap')) {
            panel.classList.add('hidden');
        }
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var panel = document.getElementById('historyPanel');
            if (panel) panel.classList.add('hidden');
        }
    });

    /* ============================================================
     *  工具栏辅助
     * ============================================================ */
    function clearAll() {
        setEditorText('');
        currentFormattedJson = '';
        errorLine = -1;
        searchMatches = [];
        currentSearchIndex = -1;
        updateSearchCount();
        document.getElementById('searchInput').value = '';
        if (!cmEditor) updateLineNumbers();
        restoreTreePlaceholder();
        setStatus('', '就绪');
    }

    function copyResult() {
        var text = currentFormattedJson || getEditorText();
        if (!text) { setStatus('warning', '⚠️ 没有可复制的内容'); return; }

        navigator.clipboard.writeText(text).then(function() {
            setStatus('success', '✅ 已复制到剪贴板');
        }).catch(function() {
            var tmp = document.createElement('textarea');
            tmp.value = text;
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand('copy'); setStatus('success', '✅ 已复制到剪贴板'); }
            catch (e) { setStatus('error', '❌ 复制失败'); }
            document.body.removeChild(tmp);
        });
    }

    /* ============================================================
     *  状态栏
     * ============================================================ */
    function setStatus(type, message) {
        var bar = document.getElementById('statusBar');
        bar.className = 'status-bar' + (type ? ' ' + type : '');
        bar.innerHTML = '<span>' + message + '</span>';

        if (type === 'success' || type === 'warning') {
            setTimeout(function() {
                if (bar.className.indexOf(type) >= 0) {
                    bar.className = 'status-bar';
                    bar.innerHTML = '<span>就绪</span>';
                }
            }, 3000);
        }
    }

    /* ============================================================
     *  CDN 渐进增强 — CodeMirror 6
     * ============================================================ */
    function tryLoadCodeMirror() {
        var cdn = 'https://esm.sh';

        // 动态 import — 失败则静默降级
        Promise.all([
            import(cdn + '/@codemirror/view@6.36.4'),
            import(cdn + '/@codemirror/state@6.5.2'),
            import(cdn + '/@codemirror/lang-json@6.0.1'),
            import(cdn + '/@codemirror/search@6.5.10'),
            import(cdn + '/codemirror@6.0.1'),
        ]).then(function(modules) {
            var viewMod = modules[0];
            var stateMod = modules[1];
            var langMod = modules[2];
            var searchMod = modules[3];
            var cmMod = modules[4];

            var EditorView = viewMod.EditorView;
            var EditorState = stateMod.EditorState;

            var textarea = document.getElementById('editorTextarea');
            var cmContainer = document.getElementById('cmContainer');
            var currentContent = textarea.value;

            cmEditor = new EditorView({
                state: EditorState.create({
                    doc: currentContent,
                    extensions: [
                        cmMod.defaultSetup,
                        langMod.json(),
                        searchMod.search(),
                        searchMod.highlightSelectionMatches(),
                        viewMod.keymap.of(searchMod.searchKeymap),
                        viewMod.lineNumbers(),
                        viewMod.highlightActiveLineGutter(),
                        viewMod.highlightActiveLine(),
                        viewMod.drawSelection(),
                        viewMod.highlightSpecialChars(),
                        viewMod.rectangularSelection(),
                        EditorView.updateListener.of(function(update) {
                            if (update.docChanged) {
                                errorLine = -1;
                                scheduleAutoFormat();
                                scheduleHistoryRecord();
                            }
                        }),
                        EditorView.theme({
                            '&': { height: '100%', fontSize: 'var(--font-size)' },
                            '.cm-content': { fontFamily: 'var(--font-mono)' },
                            '.cm-gutters': {
                                background: 'var(--bg-secondary)',
                                borderRight: '1px solid var(--border-color)',
                            },
                        }),
                    ],
                }),
                parent: cmContainer,
            });

            // 切换到 CodeMirror
            textarea.classList.add('hidden');
            document.getElementById('lineNumbers').classList.add('hidden');
            document.getElementById('searchBar').style.display = 'none';
            cmContainer.classList.remove('hidden');

        }).catch(function(e) {
            // 静默降级
            console.log('CodeMirror 加载失败，使用 textarea 模式:', e.message);
        });
    }

    /* ============================================================
     *  初始化
     * ============================================================ */
    /* ============================================================
     *  面板分隔条拖拽：调整左右宽度
     * ============================================================ */
    function initSplitter() {
        var splitter = document.getElementById('splitter');
        var leftPanel = document.querySelector('.panel-left');
        if (!splitter || !leftPanel) return;
        var container = splitter.parentElement;
        var dragging = false;

        function onMove(e) {
            if (!dragging) return;
            var maxW = container.clientWidth;
            var pct = (e.clientX - container.getBoundingClientRect().left) / maxW * 100;
            pct = Math.max(20, Math.min(80, pct)); // 左右各留至少 20%
            leftPanel.style.flexBasis = pct + '%';
        }
        function onUp() {
            dragging = false;
            splitter.classList.remove('dragging');
            document.body.classList.remove('resizing');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        }
        splitter.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            e.preventDefault();
            dragging = true;
            splitter.classList.add('dragging');
            document.body.classList.add('resizing');
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
        // 双击分隔条：恢复左右均分
        splitter.addEventListener('dblclick', function() {
            leftPanel.style.flexBasis = '50%';
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        updateLineNumbers();
        initSplitter();
        loadHistory();

        // 延迟尝试加载 CodeMirror（不影响核心功能）
        setTimeout(tryLoadCodeMirror, 500);
    });
</script>
